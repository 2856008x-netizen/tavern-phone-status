\"，数值范围[5,95]\\n示例: \\"力量:55; 敏捷:31; 体质:51; 智力:59; 感知:60; 魅力:65\\"\\n\\n特有属性: 角色的特殊能力与技能，体现世界观特色与个体差异。\\n格式: \\"{特有属性}:{数值}\\"，数值范围[0,100]，数值代表成功概率\\n示例: \\"爆裂魔法:85; 时间回溯:70; 超电磁炮:90\\"\\n\\n【属性标尺】\\n5-14:能力缺失 | 15-41:弱项 | 42-59:平均 | 60-77:精英 | 78-86:极限 | 87-95:破格。基准: 数值呈指数增长；分布呈长尾状(绝大多数聚集在42-59，87+呈断崖式稀缺)，依角色[身份背景]生成，当前值受[当前状态]修正。如:重伤→5-14; 肾上腺素→78-86\\n</属性规则>\\n\\n资源数据: \\"{资源名}:{数值}\\"，多组用分号分隔\\n示例: \\"金币:250; 行动点:3\\"","initNode":"插入主角唯一条目，设定各列数据。","deleteNode":"禁止","updateNode":"触发条件: 年龄、外貌、身份、状态、位置、属性、资源变化时（位置变化时，如果新地点不在世界地图点表中，需先在世界地图点表中添加该地点）","insertNode":"禁止"},"content":[[null,"姓名","性别","年龄","外貌特征","身份","自身状态","所在地点","基础属性","特有属性","资源数据"]],"updateConfig":{"uiSentinel":-1,"contextDepth":4,"updateFrequency":-1,"batchSize":4,"skipFloors":-1},"exportConfig":{"enabled":false,"splitByRow":false,"entryName":"主角信息","entryType":"constant","keywords":"","preventRecursion":true,"injectionTemplate":"","extraIndexEnabled":false,"extraIndexEntryName":"主角信息-索引","extraIndexColumns":[],"extraIndexColumnModes":{},"extraIndexInjectionTemplate":"","entryPlacement":{"position":"at_depth_as_system","depth":2,"order":10000},"extraIndexPlacement":{"position":"at_depth_as_system","depth":2,"order":10010},"fixedEntryPlacement":{"position":"at_depth_as_system","depth":2,"order":99990},"fixedIndexPlacement":{"position":"at_depth_as_system","depth":2,"order":99991}},"orderNo":5},"sheet_v2_inventory":{"uid":"sheet_v2_inventory","name":"背包物品","sourceData":{"note":"记录主角拥有的非装备类物品。\\n\\n【分类规则】\\n本表录入: [消耗品,材料,任务物品,道具]\\n禁入: [装备类,货币(金/银/铜币,银子,灵石等),点数(行动点、积分]\\n\\n【堆叠规则】\\n- 同名可堆叠物品获取时更新数量，禁止新增重复行\\n- 任务物品或唯一物品数量固定为1\\n\\n【约束】\\n- 物品总数≤20条\\n\\n【字段说明】\\n物品名称: ≤10字\\n类型: [消耗品,材料,任务物品,道具]\\n- 消耗品: 使用后消失，如药水、卷轴、食物\\n- 材料: 用于制作/合成/交易\\n- 任务物品: 与任务相关，含钥匙、通行证、信物等\\n- 道具: 可重复使用的功能性物品，如望远镜、绳索\\n数量: 正整数\\n品质: [普通,优秀,稀有,史诗,传说,神话]\\n描述: ≤30字，含外观、效果、用途","initNode":"根据设定添加主角初始携带物品。","deleteNode":"触发条件: ①物品数量归零 ②完全消耗 ③全部丢弃或摧毁 ④超过20条时删除品质最低且最不相关的","updateNode":"触发条件: ①数量变化 ②描述变化","insertNode":"触发条件: 获得背包中   # MVU「角色档案」单条结构（合并写入后须符合）

  - **键名**：\`CHR-\` + 三位十进制，如 \`CHR-001\`、\`CHR-002\`。

  ## 顶层字段（对象内键名须齐全）

  - **姓名**：字符串。
  - **状态**：\`出场中\` | \`暂时退场\`。
  - **角色简介**：一整段背景或简介（长文）；**勿**再使用已废弃的 **描写** 键。
  - **代表性发言**：\`Record<场景或语境标识, 具体台词字符串>\`。
  - **爱好**：\`Record<爱好标签名, { 等级: 0–10 整数, 喜欢的原因: 字符串 }>\`。
  - **当前内心想法**、**当前综合生理描述**：字符串。
  - **当前位置**：\`{ 区域ID, 建筑ID, 活动ID, 当前行为描述 }\`（活动ID 可空串）。
  - **性格**：\`Record<性格标签名, 描述字符串>\`。
  - **性癖**：\`Record<性癖标签名, { 等级: 0–10, 细节描述, 自我合理化 }>\`。
  - **隐藏性癖**：字符串。
  - **身体信息**：\`{ 年龄, 身高, 体重, 三围, 体质特征 }\`（年龄等为非负数字）。
  - **服装状态**：\`{ 上装, 下装, 内衣, 腿部, 足部, 饰品 }\`；身体五槽为 \`Record<服装名, { 状态, 描述 }>\`；饰品为 \`Record<饰品名, { 部位, 状态, 描述 }>\`。
  - **身体部位物理状态**：\`Record<部位名, { 外观描述, 当前状态 }>\`。
  - **敏感点开发**：\`Record<部位名, { 敏感等级: 非负整数（仅 Math.max(0) 下限）, 生理反应, 开发细节 }>\`。
  - **数值**：\`{ 好感度: -100~100, 性癖开发值: 0~100, 发情值: 0~100 }\`。
  - **身份标签**：\`Record<分类或名称, 短文本>\`。
  - **参与活动记录**：\`Record<活动ID, { 开始时间, 结束时间, 参与程度: 主要参与者|次要参与者|旁观者 }>\`。

  ## \`<companion>\` 候选人块与 MVU 的对应（模型只输出下列行，不写 CHR 键名）

  | companion 行键 | 写入 MVU |
  |----------------|----------|
  | 名字 | 姓名 |
  | 标签 / 年龄 / 情感状况 | 身份标签、身体信息.年龄 等 |
  | 一句话介绍、简介 | **简介** → **角色简介** 全文；一句话介绍可体现在身份标签等，**不**写入「描写」 |
  | 爱好（单行 JSON） | **爱好** |
  | 隐藏性癖 | **隐藏性癖** |
  | 性癖 / 敏感点开发 / 服装状态（各单行 JSON） | 同名字段 |
